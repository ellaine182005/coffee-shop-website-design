<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coffee Admin</title>

<link rel="stylesheet"
    href="https://unpkg.com/swiper@7/swiper-bundle.min.css" />

<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<link rel="stylesheet" href="css/style.css">

<style>

/* LOGIN POPUP (UNCHANGED) */
.login-popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.login-box {
    width: 350px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
}

.login-box input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
    text-transform: none; /* IMPORTANT: prevents forced caps */
}

.login-box button {
    width: 100%;
    padding: 12px;
    border: none;
    background: #c98d83;
    color: white;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
}

.password-container {
    position: relative;
}

.password-container input {
    padding-right: 45px;
}

.password-container i {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
}

/* HEADER ONLY ADDITION */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* LOGO + PROFILE */
.logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* PROFILE CIRCLE */
.profile-circle {
    width: 38px;
    height: 38px;
    background: #c98d83;
    color: white;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    font-size: 18px;
}

.signup-text {
    margin-top: 15px;
    font-size: 14px;
}

.signup-text a {
    color: #c98d83;
    text-decoration: none;
    font-weight: bold;
}

</style>

</head>

<body>

<!-- LOGIN POPUP -->
<div class="login-popup" id="loginPopup">

    <div class="login-box">

        <h2>Admin Login</h2>

        <!-- EMAIL (UNCHANGED BEHAVIOR) -->
        <input
            type="email"
            id="email"
            placeholder="Enter Email"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
        >

        <!-- PASSWORD -->
        <div class="password-container">

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
            >

            <i class="fas fa-eye" onclick="togglePassword()"></i>

        </div>

        <button onclick="login()">Login</button>

        <div class="signup-text">
            Don't have an account?
            <a href="register.html">Sign up</a>
        </div>

    </div>

</div>

<!-- HEADER -->
<header class="header">

    <div id="menu-btn" class="fas fa-bars"></div>

    <!-- ONLY ADDED PROFILE AROUND LOGO -->
    <div class="logo-area">

        <!-- PROFILE BUTTON -->
        <div class="profile-circle" onclick="goProfile()">
            👤
        </div>

        <a href="#" class="logo">
            coffee <i class="fas fa-mug-hot"></i>
        </a>

    </div>

    <nav class="navbar">
        <a href="#home">Dashboard</a>
        <a href="orders.html">Orders</a>
        <a href="menu.html">Menu</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>

</header>

<!-- HOME -->
<section class="home" id="home">

    <div class="row">

        <div class="content">

            <h3>fresh coffee in the morning</h3>

            <a href="#" class="btn">buy one now</a>

        </div>

        <div class="image">
            <img src="image/home-img-1.png" class="main-home-image">
        </div>

    </div>

</section>

<script>

// LOGIN (UNCHANGED)
async function login() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const res = await fetch("http://localhost:3000/admin-login", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (data.success) {

        alert("Login Successful");

        localStorage.setItem("admin", JSON.stringify(data.admin));

        document.getElementById("loginPopup").style.display = "none";

    } else {
        alert(data.message);
    }
}

// PROFILE NAVIGATION ONLY
function goProfile() {
    window.location.href = "profile.html";
}

// LOGOUT
function logout() {
    if (confirm("Are you sure you want to logout?")) {
        alert("Logout successful");
        localStorage.removeItem("admin");
        window.location.href = "index.html";
    }
}

// PASSWORD TOGGLE.
function togglePassword() {
    const input = document.getElementById("password");
    input.type = input.type === "password" ? "text" : "password";
}

</script>

</body>
</html>
